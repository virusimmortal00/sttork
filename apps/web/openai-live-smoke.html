<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="zork-voice-live-session"
      content="__ZORK_VOICE_SESSION_TOKEN__"
    />
    <title>Zork Voice live developer smoke</title>
    <link rel="stylesheet" href="/voice-shell.css" />
  </head>
  <body>
    <main id="voice-shell">
      <p class="eyebrow">Zork Voice · live developer smoke</p>
      <h1 id="status" aria-live="polite" aria-atomic="true">Starting</h1>
      <div class="status-feedback">
        <div
          id="activity-indicator"
          class="activity-indicator"
          data-state="starting"
          aria-hidden="true"
        >
          <span></span><span></span><span></span>
        </div>
        <output
          id="command-cue"
          class="command-cue visually-hidden"
          aria-live="polite"
          aria-atomic="true"
        ></output>
      </div>
      <ol
        id="action-log"
        class="action-log"
        role="list"
        aria-label="Recent game commands"
        tabindex="0"
        hidden
      ></ol>
      <p id="primary-cue" class="cue" aria-hidden="true">
        Use Start story to hear the opening.
      </p>
      <button id="capture" type="button" disabled>START STORY</button>
      <nav aria-label="Voice session controls">
        <button id="stop" type="button" disabled>Stop</button>
        <button id="pause" type="button" disabled>Pause</button>
        <button id="repeat" type="button" disabled>Repeat</button>
        <button id="toggle-transcript" type="button" aria-expanded="false">
          Transcript
        </button>
        <button id="toggle-debug" type="button" aria-expanded="false">
          Debug
        </button>
      </nav>
      <section id="transcript-panel" aria-label="Accessible transcript" hidden>
        <ol id="transcript-list"></ol>
        <form id="text-form">
          <label for="text-input">Accessible text input</label>
          <input id="text-input" autocomplete="off" disabled />
          <button id="text-submit" type="submit" disabled>Send</button>
        </form>
      </section>
      <pre id="debug-panel" aria-label="Developer event evidence" hidden></pre>
    </main>
    <script type="module" src="/app/apps/web/src/openai-live-shell.js"></script>
  </body>
</html>
