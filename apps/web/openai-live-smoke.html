<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="zork-voice-live-session"
      content="__ZORK_VOICE_SESSION_TOKEN__"
    />
    <title>Zork Voice live developer smoke</title>
    <link rel="stylesheet" href="/voice-shell.css" />
  </head>
  <body>
    <main id="voice-shell" data-story-phase="booting">
      <p class="eyebrow">Zork Voice · live developer smoke</p>
      <div class="status-stage">
        <h1 id="status" aria-live="polite" aria-atomic="true">Starting</h1>
        <div class="status-feedback">
          <div
            id="activity-indicator"
            class="activity-indicator"
            data-state="starting"
            aria-hidden="true"
          >
            <span></span><span></span><span></span>
          </div>
          <output
            id="command-cue"
            class="command-cue visually-hidden"
            aria-live="polite"
            aria-atomic="true"
          ></output>
        </div>
      </div>
      <div
        id="spoken-transcript"
        class="spoken-transcript"
        aria-hidden="true"
        hidden
      >
        <p id="spoken-line" class="spoken-line"></p>
        <ol id="spoken-history" class="spoken-history"></ol>
      </div>
      <div class="primary-action">
        <button id="capture" type="button" aria-label="Start story" disabled>
          BEGIN
        </button>
        <p id="primary-cue" class="cue" aria-hidden="true"></p>
      </div>
      <ol
        id="action-log"
        class="action-log"
        role="list"
        aria-label="Recent game commands"
        tabindex="0"
        hidden
      ></ol>
      <nav class="control-dock" aria-label="Voice session controls">
        <div class="session-actions" role="group" aria-label="Playback">
          <button id="stop" type="button" disabled>Stop</button>
          <button id="pause" type="button" disabled>Pause</button>
          <button id="repeat" type="button" disabled>Repeat</button>
        </div>
      </nav>
    </main>
    <footer class="app-footer">
      <nav class="utility-actions" aria-label="More options">
        <button
          id="toggle-transcript"
          type="button"
          aria-expanded="false"
          aria-controls="transcript-panel"
        >
          Transcript
        </button>
        <button
          id="toggle-settings"
          type="button"
          aria-expanded="false"
          aria-controls="settings-panel"
        >
          Voices
        </button>
        <button
          id="toggle-debug"
          class="developer-control"
          type="button"
          aria-expanded="false"
          aria-controls="debug-panel"
        >
          Debug
        </button>
      </nav>
    </footer>
    <dialog
      id="settings-panel"
      class="utility-modal"
      aria-labelledby="settings-heading"
      aria-modal="true"
    >
      <header class="modal-header">
        <h2 id="settings-heading">Voice preferences</h2>
        <button
          id="close-settings"
          class="modal-close"
          type="button"
          aria-label="Close voice preferences"
        >
          <span aria-hidden="true">×</span>
        </button>
      </header>
      <p class="settings-disclosure">
        These are AI-generated voices. Samples make a billable speech request.
      </p>
      <div class="settings-grid">
        <fieldset>
          <legend>Dungeon Guide</legend>
          <label for="guide-voice">Voice</label>
          <select id="guide-voice"></select>
          <label for="guide-rate">Rate</label>
          <div class="rate-control">
            <input
              id="guide-rate"
              type="range"
              min="0.75"
              max="1.25"
              step="0.05"
            />
            <output id="guide-rate-value" for="guide-rate"></output>
          </div>
          <button id="preview-guide" type="button">Sample guide</button>
        </fieldset>
        <fieldset>
          <legend>Narrator</legend>
          <label for="narrator-voice">Voice</label>
          <select id="narrator-voice"></select>
          <label for="narrator-rate">Rate</label>
          <div class="rate-control">
            <input
              id="narrator-rate"
              type="range"
              min="0.75"
              max="1.25"
              step="0.05"
            />
            <output id="narrator-rate-value" for="narrator-rate"></output>
          </div>
          <button id="preview-narrator" type="button">Sample narrator</button>
        </fieldset>
      </div>
    </dialog>
    <dialog
      id="transcript-panel"
      class="utility-modal"
      aria-labelledby="transcript-heading"
      aria-modal="true"
    >
      <header class="modal-header">
        <h2 id="transcript-heading">Transcript</h2>
        <button
          id="close-transcript"
          class="modal-close"
          type="button"
          aria-label="Close transcript"
        >
          <span aria-hidden="true">×</span>
        </button>
      </header>
      <ol id="transcript-list"></ol>
      <nav class="event-page-controls" aria-label="Transcript pages">
        <button id="transcript-older" type="button">Older</button>
        <span id="transcript-page-status" aria-live="polite"></span>
        <button id="transcript-newer" type="button">Newer</button>
      </nav>
      <form id="text-form">
        <label for="text-input">Accessible text input</label>
        <input id="text-input" autocomplete="off" disabled />
        <button id="text-submit" type="submit" disabled>Send</button>
      </form>
    </dialog>
    <dialog
      id="debug-panel"
      class="utility-modal"
      aria-labelledby="debug-heading"
      aria-modal="true"
    >
      <header class="modal-header">
        <h2 id="debug-heading">Debug evidence</h2>
        <button
          id="close-debug"
          class="modal-close"
          type="button"
          aria-label="Close debug evidence"
        >
          <span aria-hidden="true">×</span>
        </button>
      </header>
      <pre id="debug-content" aria-label="Developer event evidence"></pre>
      <nav class="event-page-controls" aria-label="Debug event pages">
        <button id="debug-older" type="button">Older</button>
        <span id="debug-page-status" aria-live="polite"></span>
        <button id="debug-newer" type="button">Newer</button>
      </nav>
    </dialog>
    <script type="module" src="/app/apps/web/src/openai-live-shell.js"></script>
  </body>
</html>
