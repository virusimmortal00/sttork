<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zork Voice deterministic shell</title>
    <link rel="stylesheet" href="/voice-shell.css" />
  </head>
  <body>
    <main id="voice-shell">
      <p class="eyebrow">Zork Voice</p>
      <h1 id="status" aria-live="polite" aria-atomic="true">Starting</h1>
      <div class="status-feedback">
        <div
          id="activity-indicator"
          class="activity-indicator"
          data-state="starting"
          aria-hidden="true"
        >
          <span></span><span></span><span></span>
        </div>
        <output
          id="command-cue"
          class="command-cue"
          aria-live="polite"
          aria-atomic="true"
        ></output>
      </div>
      <p class="cue" aria-hidden="true">Press V or use the speaking control.</p>
      <button id="capture" type="button" aria-pressed="false" disabled>
        Start speaking
      </button>
      <nav aria-label="Voice session controls">
        <button id="stop" type="button">Stop</button>
        <button id="pause" type="button">Pause</button>
        <button id="repeat" type="button">Repeat</button>
        <button id="toggle-transcript" type="button" aria-expanded="false">
          Transcript
        </button>
        <button id="toggle-debug" type="button" aria-expanded="false">
          Debug
        </button>
      </nav>
      <section id="transcript-panel" aria-label="Accessible transcript" hidden>
        <ol id="transcript-list"></ol>
        <form id="text-form">
          <label for="text-input">Accessible text input</label>
          <input id="text-input" autocomplete="off" />
          <button type="submit">Send</button>
        </form>
      </section>
      <pre id="debug-panel" aria-label="Developer event evidence" hidden></pre>
    </main>
    <script type="module" src="/app/apps/web/src/voice-shell-smoke.js"></script>
  </body>
</html>
