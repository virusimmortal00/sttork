<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zork Voice</title>
    <link rel="stylesheet" href="/voice-shell.css" />
  </head>
  <body>
    <header class="app-header">
      <p class="eyebrow">Zork Voice</p>
    </header>
    <main id="voice-shell" data-story-phase="booting">
      <div class="status-stage">
        <h1 id="status" aria-live="polite" aria-atomic="true">Starting</h1>
        <div class="status-feedback">
          <div
            id="activity-indicator"
            class="activity-indicator"
            data-state="starting"
            aria-hidden="true"
          >
            <span></span><span></span><span></span>
          </div>
          <output
            id="command-cue"
            class="command-cue visually-hidden"
            aria-live="polite"
            aria-atomic="true"
          ></output>
        </div>
      </div>
      <div id="spoken-transcript" class="spoken-transcript" hidden>
        <p id="spoken-line" class="spoken-line" aria-hidden="true"></p>
        <div id="visual-status" class="visual-status" aria-hidden="true" hidden>
          <span id="visual-status-text"></span>
          <span class="visual-status-activity"> <i></i><i></i><i></i> </span>
        </div>
        <button id="story-gate" class="story-gate" type="button" hidden>
          THE STORY BEGINS
        </button>
        <p id="idle-prompt" class="idle-prompt" aria-hidden="true" hidden>
          What will you do?
        </p>
        <div
          id="voice-waveform"
          class="voice-waveform"
          aria-hidden="true"
          hidden
        >
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span>
        </div>
        <nav class="conversation-actions" aria-label="Conversation playback">
          <button
            id="stop"
            type="button"
            aria-label="Stop playback"
            title="Stop"
            disabled
          >
            ■
          </button>
          <button
            id="repeat"
            type="button"
            aria-label="Repeat last narration"
            title="Repeat"
            disabled
          >
            ↻
          </button>
        </nav>
        <ol id="spoken-history" class="spoken-history" aria-hidden="true"></ol>
      </div>
      <div class="primary-action">
        <div class="input-control-row">
          <div class="input-transport">
            <button
              id="capture"
              type="button"
              aria-label="Start story"
              disabled
            >
              BEGIN
            </button>
            <form id="text-form" class="text-composer" hidden>
              <label class="visually-hidden" for="text-input"
                >Message the Dungeon Guide</label
              >
              <textarea
                id="text-input"
                rows="1"
                maxlength="2000"
                autocomplete="off"
                placeholder="Tell the Guide what you want to do…"
                disabled
              ></textarea>
              <button
                id="text-submit"
                type="submit"
                aria-label="Send message"
                title="Send"
                disabled
              >
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M12 19V5"></path>
                  <path d="m6 11 6-6 6 6"></path>
                </svg>
              </button>
            </form>
          </div>
          <div
            id="input-mode-switch"
            class="input-mode-switch"
            role="group"
            aria-label="Input mode"
            hidden
          >
            <button
              id="voice-mode"
              type="button"
              aria-label="Use voice input"
              title="Voice input"
              aria-pressed="true"
            >
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <rect x="9" y="3" width="6" height="11" rx="3"></rect>
                <path d="M6.5 11.5a5.5 5.5 0 0 0 11 0M12 17v4M9 21h6"></path>
              </svg>
            </button>
            <button
              id="text-mode"
              type="button"
              aria-label="Use text input"
              title="Text input"
              aria-pressed="false"
            >
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M5 6h14M12 6v13M8.5 19h7"></path>
              </svg>
            </button>
          </div>
        </div>
        <p id="primary-cue" class="cue" aria-hidden="true"></p>
      </div>
    </main>
    <footer class="app-footer">
      <nav class="utility-actions" aria-label="More options">
        <button
          id="toggle-transcript"
          type="button"
          aria-expanded="false"
          aria-controls="transcript-panel"
        >
          Transcript
        </button>
        <button
          id="toggle-debug"
          class="developer-control"
          type="button"
          aria-expanded="false"
          aria-controls="debug-panel"
        >
          Debug
        </button>
      </nav>
    </footer>
    <dialog
      id="transcript-panel"
      class="utility-modal"
      aria-labelledby="transcript-heading"
      aria-modal="true"
    >
      <header class="modal-header">
        <h2 id="transcript-heading">Transcript</h2>
        <div class="modal-header__actions">
          <button
            id="copy-transcript"
            class="modal-icon-button"
            type="button"
            aria-label="Copy transcript to clipboard"
            title="Copy transcript"
            disabled
          >
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <rect x="8" y="8" width="11" height="11" rx="2"></rect>
              <path
                d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"
              ></path>
            </svg>
          </button>
          <button
            id="close-transcript"
            class="modal-close"
            type="button"
            aria-label="Close transcript"
          >
            <span aria-hidden="true">×</span>
          </button>
        </div>
      </header>
      <output
        id="copy-transcript-status"
        class="visually-hidden"
        aria-live="polite"
      ></output>
      <ol id="transcript-list"></ol>
      <nav class="event-page-controls" aria-label="Transcript pages">
        <button id="transcript-older" type="button">Older</button>
        <span id="transcript-page-status" aria-live="polite"></span>
        <button id="transcript-newer" type="button">Newer</button>
      </nav>
    </dialog>
    <dialog
      id="debug-panel"
      class="utility-modal"
      aria-labelledby="debug-heading"
      aria-modal="true"
    >
      <header class="modal-header">
        <h2 id="debug-heading">Debug evidence</h2>
        <button
          id="close-debug"
          class="modal-close"
          type="button"
          aria-label="Close debug evidence"
        >
          <span aria-hidden="true">×</span>
        </button>
      </header>
      <pre id="debug-content" aria-label="Developer event evidence"></pre>
      <nav class="event-page-controls" aria-label="Debug event pages">
        <button id="debug-older" type="button">Older</button>
        <span id="debug-page-status" aria-live="polite"></span>
        <button id="debug-newer" type="button">Newer</button>
      </nav>
    </dialog>
    <script type="module" src="/app/apps/web/src/voice-shell-smoke.js"></script>
  </body>
</html>
